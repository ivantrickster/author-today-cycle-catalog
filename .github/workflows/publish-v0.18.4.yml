name: Publish v0.18.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.18.4.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish v0.18.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.18.4"
          package="author-today-cycle-catalog-v0.18.4.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi

          zip -j "$package" \
            annotations.css background.js consent.css consent.js \
            content.css content.js current-result.css current.css current.html current.js \
            favorite-content.css favorite.css manifest.json \
            popup.css popup.html popup.js privacy.html \
            rating.css rating.html search.css search.html search.js shared-ui.js
          zip "$package" icons/icon-16.png icons/icon-32.png icons/icon-48.png icons/icon-128.png

          gh release create "$tag" "$package" \
            --target "$GITHUB_SHA" \
            --title "v0.18.4" \
            --generate-notes \
            --latest
