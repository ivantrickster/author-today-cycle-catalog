<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="annotations.css"><link rel="stylesheet" href="consent.css"><title>Мой каталог циклов AT</title></head><body class="catalog-page">
<main><h1>Мой каталог циклов</h1><p class="intro">Сохранённые циклы, их статистика и сравнение</p>
<button id="search" style="width:100%;margin-bottom:12px">Найти новые циклы</button>
<section class="add"><label for="urls">Ссылка на цикл</label><textarea id="urls" placeholder="https://author.today/work/series/12345&#10;Можно вставить несколько ссылок — каждую с новой строки"></textarea><button id="import">Добавить цикл</button></section>
<div class="toolbar"><button id="show" class="analyze">Обновить статистику</button><button id="sortRating">Сортировать по рейтингу</button><button id="clear" class="clear">Очистить каталог</button></div>
<p id="queue" class="hint"></p><p id="notice" role="status"></p>
<div id="filters" class="filters">
  <select id="status" class="wide"><option value="all">Все статусы</option><option value="completed">Завершённые циклы</option><option value="ongoing">Циклы в процессе</option></select>
  <label class="wide">Удержание аудитории больше <input id="minAudienceRetention" type="number" min="0" max="120" placeholder="0">%</label>
  <label class="wide">Удержание лайков больше <input id="minLikeRetention" type="number" min="0" max="120" placeholder="0">%</label>
  <label class="wide option"><input id="fromSecond" type="checkbox"> Считать начиная со второго тома</label>
  <label class="wide option"><input id="finishedOnly" type="checkbox"> Учитывать только завершённые тома</label>
</div>
<section id="list"></section></main><script src="consent.js"></script><script src="popup.js"></script></body></html>
